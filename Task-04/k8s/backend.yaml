apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 906543084508.dkr.ecr.ap-south-1.amazonaws.com/blog-backend:v1
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: db-secret, key: MYSQL_DATABASE }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-secret, key: MYSQL_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: MYSQL_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: backend-secret, key: JWT_SECRET }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: blog
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
