cat > k8s/frontend.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 906543084508.dkr.ecr.ap-south-1.amazonaws.com/blog-frontend:v1
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: backend.blog.svc.cluster.local
            - name: BACKEND_PORT
              value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: blog
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
EOF
kubectl apply -f k8s/frontend.yaml
